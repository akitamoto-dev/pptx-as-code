[project]
name = "slide-image-gen-mcp"
version = "0.2.0"
description = "MCP server that generates 16:9 slide images via Microsoft Foundry image models across multiple regions (Entra ID auth, client-side load balancing)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "pptx-as-code maintainers" }]
dependencies = [
    "fastmcp>=3.4,<4",
    "openai>=2.43,<3",
    "azure-identity>=1.25,<2",
]

[project.scripts]
# `uvx slide-image-gen-mcp` または `uv run slide-image-gen-mcp` で起動可能にする
slide-image-gen-mcp = "slide_image_gen_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slide_image_gen_mcp"]
